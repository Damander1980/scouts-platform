<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Our Troop Manager</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #E9E3D6; color: #101B2D;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
  .card { background: #fff; border-radius: 20px; padding: 28px; max-width: 380px; text-align: center; box-shadow: 0 14px 36px rgba(16,27,45,.12); }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: #4B5568; font-size: 16px; line-height: 1.5; margin: 0 0 20px; }
  button { min-height: 48px; padding: 0 28px; border-radius: 999px; border: 0; background: #F5B700; color: #101B2D; font-weight: 700; font-size: 16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>Our Troop Manager needs an internet connection. Check your Wi-Fi or cell signal and try again.</p>
    <button onclick="location.href='https://ourtroopmanager.com/home'">Try again</button>
  </div>
</body>
</html>

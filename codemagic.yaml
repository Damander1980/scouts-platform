# Cloud builds for the native apps (this PC has no Mac or Android tools). The apps are a Capacitor shell
# around https://ourtroopmanager.com, so a web release reaches them without a new build; build again only
# when native parts change (icons, plugins, permissions).
#
# One-time setup in Codemagic (codemagic.io, sign in with GitHub, add the scouts-platform repo):
#   Team settings → Integrations → Developer Portal: connect an App Store Connect API key, named "ASC key".
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ASC key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ourtroopmanager.app
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: 6826603321 # Our Troop Manager in App Store Connect (not a secret)
      node: 22
      xcode: latest
    scripts:
      - name: Install
        script: npm ci
      - name: Sync native project
        script: npx cap sync ios
      - name: Signing
        script: xcode-project use-profiles
      - name: Build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          cd ios/App && agvtool new-version -all $((LATEST + 1))
      - name: Build
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-test:
    name: Android → install file
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install
        script: npm ci
      - name: Sync native project
        script: npx cap sync android
      - name: Build
        script: cd android && chmod +x gradlew && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
